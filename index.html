<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d0b0a">
  <title>Life RPG</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <section id="hero"></section>
    <p id="message" class="message"></p>
    <section id="auth" class="auth"></section>

    <h2>Характеристики</h2>
    <section id="stats"></section>

    <nav class="tabs">
      <button class="tab active" data-tab="quests">Квесты</button>
      <button class="tab" data-tab="shop">Магазин</button>
      <button class="tab" data-tab="achievements">Ачивки</button>
    </nav>
    <section id="quests" class="tab-panel"></section>
    <section id="shop" class="tab-panel" hidden></section>
    <section id="achievements" class="tab-panel" hidden></section>

    <div class="tools">
      <button id="undo-btn">Отменить</button>
      <button id="export-btn">Экспорт</button>
      <button id="import-btn">Импорт</button>
      <button id="reset-btn" class="danger">Сброс</button>
    </div>
    <p id="backup-hint" class="backup-hint"></p>
    <input type="file" id="import-file" accept=".json" hidden>

    <footer class="credits">
      Иконки: <a href="https://game-icons.net" target="_blank" rel="noopener">game-icons.net</a> (CC BY 3.0) ·
      <a href="https://github.com/KirTokin/life-rpg/blob/main/CREDITS.md" target="_blank" rel="noopener">авторы</a>
    </footer>
  </div>

  <!-- Слой эффектов: level-up и ачивки -->
  <div id="fx" class="fx" hidden>
    <img id="fx-img" alt="">
    <div id="fx-title" class="fx-title"></div>
    <div id="fx-sub" class="fx-sub"></div>
  </div>

  <script src="assets/vendor/supabase.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
