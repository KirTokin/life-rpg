<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life RPG</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h1>Герой</h1>
        <p>Уровень: <span id="level">1</span></p>
        <div class="bar"><div class="bar-fill" id="xp-fill"></div></div>
        <p><span id="xp">0</span> / <span id="xp-next">100</span> XP</p>
        <button id="quest-btn">Выполнить квест (+30 XP)</button>
    </div>
    <script src="app.js"></script>
</body>
</html>
