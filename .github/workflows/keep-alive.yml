name: Supabase keep-alive

on:
  schedule:
    - cron: '17 3 */3 * *'   # каждые 3 дня в 03:17 UTC (08:17 по Алматы)
  workflow_dispatch:          # кнопка ручного запуска во вкладке Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/log_entries?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY")
          echo "Supabase ответил: HTTP $status"
          test "$status" = "200"